# --- Plugin coordinates -------------------------------------------------------
# WARNING: pluginGroup doubles as the plugin ID (see plugin.xml) and is immutable
# on JetBrains Marketplace after the first upload. Do not change it.
pluginGroup = com.kitworks.tablekit
pluginName = TableKit
pluginVersion = 0.1.0

# --- Target platform ----------------------------------------------------------
# Build against the LOWEST supported IDE (2024.2 / build 242, Java 21, Kotlin
# stdlib 1.9.24) so the plugin stays backwards compatible. See PLAN.md.
platformVersion = 2024.2.6
pluginSinceBuild = 242

# --- Build --------------------------------------------------------------------
# The IDE ships its own Kotlin stdlib -> never bundle ours. https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true

# The build cache is off on purpose. It once restored a test class compiled
# against an older signature into an otherwise clean build, so the suite passed
# while the code it tested no longer existed. A full build here takes about ten
# seconds; a green build that lies costs more than that.
org.gradle.caching = false
org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=768m
